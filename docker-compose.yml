name: volt-registry

networks:
    internal:
    voltcloud-net:
        external: true

volumes:
    mongo-data:
    rustfs-data:

services:
    mongo:
        image: mongo:7
        restart: unless-stopped
        volumes:
            - mongo-data:/data/db
        networks:
            - internal

    rustfs:
        image: rustfs/rustfs:latest
        restart: unless-stopped
        environment:
            RUSTFS_ROOT_USER: voltadmin
            RUSTFS_ROOT_PASSWORD: voltadminsecret
        ports:
            - '6090:9000'
        volumes:
            - rustfs-data:/data
        networks:
            - internal

    rustfs-init:
        image: minio/mc:latest
        depends_on:
            - rustfs
        entrypoint: >
            /bin/sh -c "
            until (/usr/bin/mc alias set local http://rustfs:9000 voltadmin voltadminsecret) do echo 'waiting for rustfs'; sleep 2; done;
            /usr/bin/mc mb --ignore-existing local/vpm-tarballs;
            /usr/bin/mc mb --ignore-existing local/vpm-readmes;
            /usr/bin/mc anonymous set download local/vpm-tarballs;
            /usr/bin/mc anonymous set download local/vpm-readmes;
            echo 'rustfs buckets ready';
            "
        networks:
            - internal

    registry:
        build:
            context: ./server
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file:
            - ./server/.env
        depends_on:
            - mongo
            - rustfs
            - rustfs-init
        ports:
            - '6085:8082'
        networks:
            - internal
            - voltcloud-net

    client:
        build:
            context: .
            dockerfile: client/Dockerfile
            args:
                APP: Registry
        restart: unless-stopped
        depends_on:
            - registry
        ports:
            - '6080:80'
        networks:
            - internal
